<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PicSey">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0c">
<title>PicSey</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <div class="bar" id="topEff" hidden>
    <button class="ibtn" id="effCancel" aria-label="Cancelar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    <button class="pill" id="effPill"><span id="effTitle"></span><i id="effIcon"></i></button>
    <button class="ok" id="effOk" aria-label="Aplicar"><svg viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></svg></button>
  </div>
</header>
<main id="stage">
  <canvas id="cv"></canvas><canvas id="ov"></canvas>
  <div id="hint" hidden>Toque em Adesivo para adicionar um texto ou uma forma.</div>
  <div id="fl">
    <button id="homeBtn" aria-label="Tela inicial"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></svg></button>
    <button id="layBtn" aria-label="Camadas"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <button id="histBtn" aria-label="Histórico"><svg viewBox="0 0 24 24"><path d="M12 4v13M6 12l6 6 6-6"/><path d="M5 21h14"/></svg></button>
    <button id="undo" aria-label="Desfazer" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redo" aria-label="Refazer" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div id="zoom"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button><button id="zfit" aria-label="Ajustar à tela" style="font-size:15px">⤢</button></div>
  <div id="toast" role="status"></div>
  <div id="ovl" hidden><div id="ovlBody"></div></div>
</main>
<div id="effbar" hidden>
  <div id="effOpts"></div>
  <div class="srow"><button class="pm" id="effMinus" aria-label="Diminuir">−</button><input type="range" id="effRange" aria-label="Valor do efeito"><button class="pm" id="effPlus" aria-label="Aumentar">+</button></div>
  <div class="tgt" id="effTgt"></div>
</div>
<section id="sheet" hidden><div id="panelBody"></div></section>
<nav id="bottom"></nav>

<div id="lst" class="screen" hidden>
  <div class="bar"><button class="ibtn" id="efClose" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button><div class="ttl" id="lstTitle"></div></div>
  <div id="efList"></div>
</div>

<div id="lay" class="screen" hidden>
  <div class="card">
    <div class="bar"><button class="ibtn" id="layClose" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button><div class="ttl">Camadas</div></div>
    <div id="layList"></div>
    <div id="layFoot"></div>
  </div>
</div>

<div id="splash" class="screen splash">
  <div class="sp-in">
    <img class="logo" src="img/picsey.jpg" alt="PicSey - Say it within a picture" draggable="false">
    <button class="gbtn" id="spPhoto">Escolher uma foto</button>
    <button class="gbtn alt" id="spBlank">Começar com tela em branco</button>
    <button class="gbtn alt" id="spCont" hidden>Continuar o último projeto</button>
  </div>
  <button class="spfoot" id="spLog">Versão <span id="spVer"></span> · <u>Histórico de mudanças</u></button>
</div>

<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="imgIn" accept="image/*" multiple hidden>
<input type="file" id="fontIn" multiple hidden>
<script src="js/01-versao.js"></script>
<script src="js/02-base.js"></script>
<script src="js/03-medidas-e-ajustes.js"></script>
<script src="js/04-pincel-e-desenho.js"></script>
<script src="js/05-palco.js"></script>
<script src="js/06-objetos.js"></script>
<script src="js/07-paineis.js"></script>
<script src="js/08-listas-e-efeitos.js"></script>
<script src="js/09-inicio.js"></script>
</body>
</html>
