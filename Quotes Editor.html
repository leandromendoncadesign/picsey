/* Layout: editor de celular em uma tela. Barra no topo, palco com a arte no meio, painel de ferramentas e abas embaixo. Escuro por padrão para a arte ser o centro. */
:root{
  --bg:#0e131a; --stage:#090c11; --panel:#161d27; --panel2:#1f2833; --line:#2a3544;
  --fg:#e9eef5; --mut:#8d9bb0; --accent:#f0b429; --accent-fg:#1a1405; --danger:#ef6b6b;
  --ck1:#2b323d; --ck2:#222832;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --brand:"Anton","Impact","Arial Narrow",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f5; --stage:#dde3ec; --panel:#ffffff; --panel2:#e8edf4; --line:#d0d8e4;
    --fg:#172030; --mut:#56657b; --accent:#a96a00; --accent-fg:#ffffff; --danger:#c43c3c;
    --ck1:#cfd6e1; --ck2:#c2cad7; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1f5; --stage:#dde3ec; --panel:#ffffff; --panel2:#e8edf4; --line:#d0d8e4;
  --fg:#172030; --mut:#56657b; --accent:#a96a00; --accent-fg:#ffffff; --danger:#c43c3c;
  --ck1:#cfd6e1; --ck2:#c2cad7; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 var(--ui);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#top{display:flex;align-items:center;gap:8px;height:48px;flex:none}
.brand{font:22px/1 var(--brand);letter-spacing:.04em;text-transform:uppercase;margin-right:auto;white-space:nowrap}
.brand b{color:var(--accent);font-weight:400}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.ibtn:disabled{opacity:.35}
.ibtn svg{width:20px;height:20px}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;height:40px;padding:0 16px;font-weight:700}
#stage{position:relative;flex:1 1 auto;min-height:120px;background:var(--stage);border-radius:12px;overflow:hidden;touch-action:none}
#stage canvas{position:absolute;left:0;top:0}
#cv{background-image:linear-gradient(45deg,var(--ck1) 25%,transparent 25%,transparent 75%,var(--ck1) 75%),linear-gradient(45deg,var(--ck1) 25%,var(--ck2) 25%,var(--ck2) 75%,var(--ck1) 75%);background-size:16px 16px;background-position:0 0,8px 8px;box-shadow:0 2px 18px rgba(0,0,0,.35)}
#ov{pointer-events:none}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
#hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mut);pointer-events:none}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;max-width:92%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#sheet{flex:none;max-height:38vh;overflow:auto;background:var(--panel);border-radius:12px 12px 0 0;margin-top:8px;border:1px solid var(--line);border-bottom:0;-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
#panelBody{padding:12px;display:flex;flex-direction:column;gap:10px}
#tabs{flex:none;display:grid;grid-template-columns:repeat(8,1fr);background:var(--panel);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:0 0 12px 12px;margin-bottom:6px}
#tabs button{background:none;border:0;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:10px}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;min-height:36px}
.row .lab{flex:0 0 92px;color:var(--mut);font-size:12.5px}
.row.sl input[type=range]{flex:1;min-width:0}
.row output{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px}
input[type=range]{accent-color:var(--accent);height:30px}
input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
input[type=number],textarea,select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:74px;resize:vertical;font-size:16px}
input[type=number]{width:96px;font-size:16px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;font-weight:600}
.btn.accent{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--danger)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;min-height:32px;padding:0 10px}
.sm{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;min-height:34px;padding:0 13px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.grid .btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;min-height:62px;font-size:11.5px}
.grid svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.h{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.note{color:var(--mut);font-size:12.5px;line-height:1.45}
.layer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px;background:var(--panel2)}
.layer.on{border-color:var(--accent)}
.layer .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .t{font-size:11px;color:var(--mut);flex:none}
.layer button.s{width:34px;height:34px;border-radius:8px;border:0;background:none;font-size:16px}
.layer button.s:disabled{opacity:.3}
.switch{display:flex;align-items:center;gap:10px;min-height:36px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.dlg{background:var(--panel);width:100%;max-width:560px;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;border:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.db img{width:100%;max-height:52vh;object-fit:contain;background:var(--stage);border-radius:10px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.frow{display:flex;align-items:center;gap:8px}
.frow .pick{flex:1;min-width:0;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chlog h4{margin:0 0 4px;font-size:15px}
.chlog ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

  for(const c of[cv,ov]){c.style.width=W+'px';c.style.height=H+'px';c.style.left=left+'px';c.style.top=top+'px'}
}

  const k=pk(),W=Math.max(1,Math.round(doc.w*k)),H=Math.max(1,Math.round(doc.h*k));

function drawOverlay(k){
  const c=ov.getContext('2d');c.clearRect(0,0,ov.width,ov.height);hnd={};
  const rect=cv.getBoundingClientRect(),cpp=(rect.width/cv.width)||1,u=px=>px/cpp;

    c.fillStyle='rgba(0,0,0,.55)';c.beginPath();c.rect(0,0,ov.width,ov.height);c.rect(x,y,w,hh);c.fill('evenodd');
    c.strokeStyle='#f0b429';c.lineWidth=u(2);c.strokeRect(x,y,w,hh);
    c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=u(1);c.beginPath();
    for(let i=1;i<3;i++){c.moveTo(x+w*i/3,y);c.lineTo(x+w*i/3,y+hh);c.moveTo(x,y+hh*i/3);c.lineTo(x+w,y+hh*i/3)}c.stroke();
    const pts={nw:[x,y],n:[x+w/2,y],ne:[x+w,y],e:[x+w,y+hh/2],se:[x+w,y+hh],s:[x+w/2,y+hh],sw:[x,y+hh],w:[x,y+hh/2]};
    for(const[kk,p]of Object.entries(pts)){hnd[kk]=p;c.fillStyle='#f0b429';c.strokeStyle='#1a1405';c.lineWidth=u(1.5);c.beginPath();c.arc(p[0],p[1],u(8),0,7);c.fill();c.stroke()}
    return}
  if(tab==='brush'){if(brushPos){const rr=brush.size/2*k;c.beginPath();c.arc(brushPos.x*k,brushPos.y*k,Math.max(u(3),rr),0,7);c.strokeStyle='rgba(0,0,0,.75)';c.lineWidth=u(3);c.stroke();c.strokeStyle='#fff';c.lineWidth=u(1.3);c.stroke()}return}
  const l=curLayer();if(!l||!l.vis)return;
  const b=bbox(l),cx=l.x*k,cy=l.y*k,hw=b.w*k/2,hh=b.h*k/2,a=l.rot*Math.PI/180,co=Math.cos(a),si=Math.sin(a);
  const P=(x,y)=>[cx+x*co-y*si,cy+x*si+y*co];
  const poly=[P(-hw,-hh),P(hw,-hh),P(hw,hh),P(-hw,hh)];
  const path=()=>{c.beginPath();poly.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath()};
  path();c.strokeStyle='rgba(0,0,0,.7)';c.lineWidth=u(4);c.stroke();path();c.strokeStyle='#f0b429';c.lineWidth=u(2);c.stroke();
  const rot=P(0,-hh-u(34)),top=P(0,-hh);
  c.beginPath();c.moveTo(top[0],top[1]);c.lineTo(rot[0],rot[1]);c.strokeStyle='#f0b429';c.lineWidth=u(2);c.stroke();
  const H=(name,p,g)=>{hnd[name]=p;c.fillStyle='#f0b429';c.strokeStyle='#1a1405';c.lineWidth=u(2);c.beginPath();c.arc(p[0],p[1],u(14),0,7);c.fill();c.stroke();
    c.fillStyle='#1a1405';c.font=`bold ${u(16)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(g,p[0],p[1]+u(1))};

const toDoc=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*doc.w,y:(e.clientY-r.top)/r.height*doc.h}};
function handleAt(e){const r=cv.getBoundingClientRect(),cpp=r.width/cv.width;let best=null,bd=26;
  for(const[k,p]of Object.entries(hnd)){const d=Math.hypot(r.left+p[0]*cpp-e.clientX,r.top+p[1]*cpp-e.clientY);if(d<bd){bd=d;best=k}}return best}

  const x=dx*Math.cos(a)-dy*Math.sin(a),y=dx*Math.sin(a)+dy*Math.cos(a);if(l.type==='paint'&&l.id!==sel)return paintHit(l,x,y);return Math.abs(x)<=b.w/2+pad&&Math.abs(y)<=b.h/2+pad}

  for(let i=doc.layers.length-1;i>=0;i--){const l=doc.layers[i];if(l.vis&&inLayer(l,p))return l}return null}
const snapBase=l=>({size:l.size,strokeW:l.strokeW,w:l.w,h:l.h,shB:l.shB,shX:l.shX,shY:l.shY});

const ptrs=new Map();let drag=null,gest=null;

  if(ptrs.size===2){if(drag&&drag.mode==='brush'){const i=drag.list.indexOf(drag.s);if(i>=0)drag.list.splice(i,1);drag.l._ls=null;drag.l._sv=null;brushPos=null;render()}else if(drag&&drag.changed)commit();drag=null;startGest();return}if(ptrs.size>2)return;onDown(e)});
stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gest)doGest();else if(drag)onMove(e)});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(gest&&ptrs.size<2){if(gest.changed)commit();gest=null;return}
  if(drag){if(drag.mode==='brush'){endStroke(drag.l,drag.list);brushPos=null;commit();panel();render()}else if(drag.mode==='crop'){}else if(drag.changed)commit();drag=null}};

function pair(){const a=[...ptrs.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,ang:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2}}
function startGest(){const g=pair(),l=curLayer();
  gest=l&&!crop&&tab!=='brush'?{t:'layer',g,l,base:snapBase(l),rot:l.rot,changed:false}:{t:'view',g,zoom:view.zoom,px:view.px,py:view.py};}
function doGest(){const g=pair();gest.changed=true;
  if(gest.t==='layer'){scaleLayer(gest.l,gest.base,g.d/gest.g.d);gest.l.rot=gest.rot+(g.ang-gest.g.ang)*180/Math.PI}
  else{view.zoom=clamp(gest.zoom*g.d/gest.g.d,.4,10);view.px=gest.px+(g.mx-gest.g.mx);view.py=gest.py+(g.my-gest.g.my)}
  render()}

$('#zin').onclick=()=>zoomBy(1.3);$('#zout').onclick=()=>zoomBy(1/1.3);$('#zfit').onclick=()=>{view.zoom=1;view.px=0;view.py=0;render()};
new ResizeObserver(()=>render()).observe(stage);

function samplePixel(e,cb){const r=cv.getBoundingClientRect();const x=clamp(Math.floor((e.clientX-r.left)/r.width*cv.width),0,cv.width-1),y=clamp(Math.floor((e.clientY-r.top)/r.height*cv.height),0,cv.height-1);
  const d=cv.getContext('2d').getImageData(x,y,1,1).data;cb('#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''))}
function onDown(e){

  if(crop){const hd=handleAt(e);drag={mode:'crop',hd:hd||(p.x>=crop.x&&p.x<=crop.x+crop.w&&p.y>=crop.y&&p.y<=crop.y+crop.h?'move':null),r:{...crop},p};if(!drag.hd)drag=null;return}
  if(tab==='brush'){const t=brushTarget();
    if(!t){toast(brush.mode==='restore'?'Restaurar funciona em imagens. Selecione uma na lista.':'Selecione uma imagem ou camada de pintura na lista.');return}
    const q=toLocal(t.l,p),st={u:Math.random().toString(36).slice(2,9),m:brush.mode,c:brush.color,s:Math.max(1,brush.size/q.sc),hd:brush.hard,o:brush.op,p:[r1(q.x),r1(q.y)]};
    t.list.push(st);t.l._ls=st;drag={mode:'brush',l:t.l,list:t.list,s:st,changed:true};brushPos=p;render();return}

function onMove(e){

/* ---------- recorte ---------- */
function fitRatio(r){const w=Math.min(doc.w,doc.h*r),hh=w/r;return{x:(doc.w-w)/2,y:(doc.h-hh)/2,w,h:hh}}
function cropDrag(d,p){
  const{x,y,w,h:hh}=d.r,dx=p.x-d.p.x,dy=p.y-d.p.y,m=24;
  if(d.hd==='move'){crop.x=clamp(x+dx,0,doc.w-w);crop.y=clamp(y+dy,0,doc.h-hh);return}
  let x1=x,y1=y,x2=x+w,y2=y+hh;const hd=d.hd;
  if(hd.includes('w'))x1=clamp(x+dx,0,x2-m);if(hd.includes('e'))x2=clamp(x+w+dx,x1+m,doc.w);
  if(hd.includes('n'))y1=clamp(y+dy,0,y2-m);if(hd.includes('s'))y2=clamp(y+hh+dy,y1+m,doc.h);
  if(crop.ratio){const r=crop.ratio;let nw=x2-x1,nh=y2-y1;
    if(hd.length===2){nh=nw/r}else if(hd==='n'||hd==='s'){nw=nh*r}else{nh=nw/r}
    const cx=(x1+x2)/2,cy=(y1+y2)/2;
    if(hd.length===2){if(hd.includes('w'))x1=x2-nw;else x2=x1+nw;if(hd.includes('n'))y1=y2-nh;else y2=y1+nh}
    else if(hd==='n'||hd==='s'){x1=cx-nw/2;x2=cx+nw/2;if(hd==='n')y1=y2-nh;else y2=y1+nh}
    else{y1=cy-nh/2;y2=cy+nh/2;if(hd==='w')x1=x2-nw;else x2=x1+nw}
    const sx=Math.min(1,(Math.min(x2,doc.w)-Math.max(x1,0))/(x2-x1)),sy=Math.min(1,(Math.min(y2,doc.h)-Math.max(y1,0))/(y2-y1)),s=Math.min(sx,sy);
    if(s<1||x1<0||y1<0||x2>doc.w||y2>doc.h){const f=fitRatio(r);const k=Math.min(1,Math.min(nw,f.w)/f.w);
      const ww=Math.min(nw,doc.w,doc.h*r),hh2=ww/r;let ax=(x1+x2)/2-ww/2,ay=(y1+y2)/2-hh2/2;
      x1=clamp(ax,0,doc.w-ww);y1=clamp(ay,0,doc.h-hh2);x2=x1+ww;y2=y1+hh2;void k}}

/* ---------- imagens ---------- */
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('Não consegui abrir a imagem.'));im.src=u})}
async function addAsset(file){
  let blob=file,im=await loadImg(blob);
  const max=4096;if(Math.max(im.naturalWidth,im.naturalHeight)>max){
    const f=max/Math.max(im.naturalWidth,im.naturalHeight),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*f);c.height=Math.round(im.naturalHeight*f);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const png=/png|webp|gif/i.test(file.type);blob=await new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.95));im=await loadImg(blob)}
  const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  assets[id]={blob,img:im,w:im.naturalWidth,h:im.naturalHeight};safe(()=>kvSet('asset:'+id,blob));return id}
async function openPhoto(file){try{const id=await addAsset(file),a=assets[id];
    doc={w:a.w,h:a.h,bg:null,adj:defAdj(),nid:1,layers:[]};sel=null;view.zoom=1;view.px=view.py=0;
    const l=newLayer('image',{asset:id,name:'Foto',w:a.w,h:a.h,adj:defAdj()});doc.layers.push(l);sel=l.id;commit();panel();render();toast('Foto aberta: '+a.w+' × '+a.h)}catch(e){toast(e.message)}}
async function addImages(files){try{for(const f of files){const id=await addAsset(f),a=assets[id];const s=Math.min(1,doc.w*.8/a.w,doc.h*.8/a.h);
      const l=newLayer('image',{asset:id,name:f.name.replace(/\.[^.]+$/,'').slice(0,24)||'Imagem',w:a.w*s,h:a.h*s,adj:defAdj()});doc.layers.push(l);sel=l.id}
    tab='image';commit();panel();render()}catch(e){toast(e.message)}}
$('#photoIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openPhoto(f)};
$('#imgIn').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)addImages(f)};

  if(customFonts[name]||BUILTIN.includes(name))name+=' '+(Object.keys(customFonts).length+2);
  const ff=new FontFace(name,buf);await ff.load();document.fonts.add(ff);customFonts[name]=ff;safe(()=>kvSet('font:'+name,buf));return name}
$('#fontIn').onchange=async e=>{const fs=[...e.target.files];e.target.value='';let ok=0,bad=0;
  for(const f of fs){try{await addFontFile(f);ok++}catch(err){bad++}}
  toast(ok?`${ok} fonte(s) carregada(s)${bad?`, ${bad} inválida(s)`:''}`:'Arquivo de fonte inválido. Use .ttf, .otf ou .woff.');
  if(fontPickerRefresh)fontPickerRefresh();render()};

        rm?h('button',{class:'ghost sm danger',onclick:()=>{document.fonts.delete(customFonts[n]);delete customFonts[n];safe(()=>kvDel('font:'+n));build();render()}},'Remover'):null))};
    group('Fontes do PicSay',BUILTIN);group('Do seu aparelho',Object.keys(customFonts),true);group('Do iPhone',SYSFONTS)};
  fontPickerRefresh=build;build()}

/* ---------- histórico ---------- */
const updUndo=()=>{$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1};
let saveT=0;
function commit(){const s=snap();if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1;updUndo();
  clearTimeout(saveT);saveT=setTimeout(()=>safe(()=>kvSet('state',s)),700)}
function restore(s){const o=JSON.parse(s);doc=o.doc;sel=o.sel;crop=null;updUndo();panel();render();clearTimeout(saveT);saveT=setTimeout(()=>safe(()=>kvSet('state',s)),700)}
$('#undo').onclick=()=>{if(hi>0){hi--;restore(hist[hi])}};
